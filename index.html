<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRENDPRO — Futuristic Gen-Z E-Commerce Platform</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                            900: '#4c1d95',
                            950: '#2e1065'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #030712;
            color: #f3f4f6;
            overflow-x: hidden;
        }
        .glass-panel {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover {
            border-color: rgba(139, 92, 246, 0.4);
            transform: translateY(-3px);
            box-shadow: 0 12px 30px -10px rgba(139, 92, 246, 0.3);
        }
        .gradient-text {
            background: linear-gradient(135deg, #c084fc 0%, #ec4899 50%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #7c3aed 0%, #db2777 50%, #2563eb 100%);
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #030712;
        }
        ::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4b5563;
        }
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.4; filter: blur(40px); }
            50% { opacity: 0.8; filter: blur(60px); }
        }
        .animate-glow {
            animation: pulseGlow 8s infinite ease-in-out;
        }
        @keyframes floatAnim {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .animate-float {
            animation: floatAnim 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-purple-500 selection:text-white">

    <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
        <div class="absolute -top-40 -left-40 w-96 h-96 rounded-full bg-purple-600/20 animate-glow"></div>
        <div class="absolute top-1/2 -right-40 w-96 h-96 rounded-full bg-pink-600/15 animate-glow" style="animation-delay: 3s;"></div>
        <div class="absolute -bottom-40 left-1/3 w-96 h-96 rounded-full bg-blue-600/15 animate-glow" style="animation-delay: 6s;"></div>
    </div>

    <div id="toast-root" class="fixed top-5 right-5 z-50 flex flex-col gap-3 pointer-events-none"></div>

    <div id="modal-root" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md hidden transition-all duration-300"></div>

    <div id="app" class="relative z-10 flex flex-col min-h-screen">
        <header id="main-header" class="sticky top-0 z-40 glass-panel border-b border-white/10 transition-all duration-300"></header>

        <main id="main-content" class="flex-grow container mx-auto px-4 py-6 max-w-7xl"></main>

        <footer id="main-footer" class="glass-panel border-t border-white/10 mt-16 py-12"></footer>

        <nav id="mobile-nav" class="md:hidden fixed bottom-0 left-0 right-0 z-40 glass-panel border-t border-white/10 px-6 py-3 flex justify-between items-center text-xs"></nav>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot, getDocs, query, where } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCjr6addRfZbk7Ce4Lzku9HnBqzqHN5LtY",
            authDomain: "store-1a8c3.firebaseapp.com",
            databaseURL: "https://store-1a8c3-default-rtdb.firebaseio.com",
            projectId: "store-1a8c3",
            storageBucket: "store-1a8c3.firebasestorage.app",
            messagingSenderId: "1046602403433",
            appId: "1:1046602403433:web:ee005a4ddaa07ada5d1cf8",
            measurementId: "G-XNJYEPKDY0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);
        const googleProvider = new GoogleAuthProvider();

        const OWNER_EMAIL = "saurav586kumar@gmail.com";

        let state = {
            user: null,
            isOwner: false,
            currentRoute: 'home',
            routeParams: {},
            products: [],
            categories: [],
            cart: JSON.parse(localStorage.getItem('trendpro_cart') || '[]'),
            wishlist: JSON.parse(localStorage.getItem('trendpro_wishlist') || '[]'),
            compare: JSON.parse(localStorage.getItem('trendpro_compare') || '[]'),
            orders: [],
            addresses: [],
            wallet: { balance: 0, transactions: [] },
            banners: [],
            coupons: [],
            giftCards: [],
            chats: [],
            activeChatId: null,
            messages: [],
            reviews: [],
            notifications: [],
            auditLogs: [],
            searchQuery: '',
            activeFilterCategory: 'all',
            sortBy: 'featured',
            ownerActiveTab: 'dashboard'
        };

        window.showToast = function(message, type = 'success') {
            const root = document.getElementById('toast-root');
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-emerald-500/90 text-white' : type === 'error' ? 'bg-rose-500/90 text-white' : 'bg-purple-600/90 text-white';
            const icon = type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-info';
            
            toast.className = `pointer-events-auto flex items-center gap-3 px-5 py-3 rounded-xl shadow-2xl backdrop-blur-md transform transition-all duration-300 translate-y-2 opacity-0 ${bgClass}`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-lg"></i><span class="font-medium text-sm">${message}</span>`;
            root.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        };

        window.showModal = function(title, htmlContent, actionsHtml = '') {
            const root = document.getElementById('modal-root');
            root.innerHTML = `
                <div class="glass-panel w-full max-w-lg rounded-2xl p-6 shadow-2xl border border-white/20 transform transition-all">
                    <div class="flex justify-between items-center mb-4 pb-3 border-b border-white/10">
                        <h3 class="text-xl font-bold text-white flex items-center gap-2"><i class="fa-solid fa-sparkles text-purple-400"></i> ${title}</h3>
                        <button onclick="closeModal()" class="text-gray-400 hover:text-white transition-colors w-8 h-8 rounded-full flex items-center justify-center bg-white/5"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <div class="text-gray-300 text-sm mb-6 max-h-[60vh] overflow-y-auto pr-1">${htmlContent}</div>
                    <div class="flex justify-end gap-3 pt-3 border-t border-white/10">${actionsHtml || '<button onclick="closeModal()" class="px-5 py-2 rounded-xl bg-purple-600 text-white font-semibold hover:bg-purple-700 transition-all shadow-lg shadow-purple-500/30">Close</button>'}</div>
                </div>
            `;
            root.classList.remove('hidden');
        };

        window.closeModal = function() {
            document.getElementById('modal-root').classList.add('hidden');
        };

        async function initializeDatabaseDefaults() {
            try {
                const catSnap = await getDocs(collection(db, 'categories'));
                if (catSnap.empty) {
                    const defaultCats = [
                        { name: 'Gen-Z Streetwear', slug: 'streetwear', icon: 'fa-shirt', image: 'https://placehold.co/600x400/4c1d95/ffffff?text=Streetwear' },
                        { name: 'Cyber Tech & Gear', slug: 'tech', icon: 'fa-microchip', image: 'https://placehold.co/600x400/2e1065/ffffff?text=Cyber+Tech' },
                        { name: 'Future Footwear', slug: 'footwear', icon: 'fa-shoe-prints', image: 'https://placehold.co/600x400/6d28d9/ffffff?text=Footwear' },
                        { name: 'Holographic Collectibles', slug: 'collectibles', icon: 'fa-cube', image: 'https://placehold.co/600x400/7c3aed/ffffff?text=Collectibles' }
                    ];
                    for (const c of defaultCats) {
                        await addDoc(collection(db, 'categories'), c);
                    }
                }

                const prodSnap = await getDocs(collection(db, 'products'));
                if (prodSnap.empty) {
                    const defaultProducts = [
                        {
                            title: 'Cyberpunk Neon Oversized Hoodie',
                            category: 'streetwear',
                            price: 2499,
                            comparePrice: 3999,
                            rating: 4.8,
                            reviewCount: 124,
                            stock: 45,
                            isFeatured: true,
                            isFlashDeal: true,
                            images: ['https://images.unsplash.com/photo-1556905055-8f358a7a47b2?auto=format&fit=crop&q=80&w=800'],
                            description: 'Heavyweight organic cotton oversized hoodie featuring reactive neon cyber graphics and built-in thumb holes.'
                        },
                        {
                            title: 'Holographic Matrix Smart Glasses V3',
                            category: 'tech',
                            price: 14999,
                            comparePrice: 19999,
                            rating: 4.9,
                            reviewCount: 88,
                            stock: 12,
                            isFeatured: true,
                            isFlashDeal: true,
                            images: ['https://images.unsplash.com/photo-1572635196237-14b3f281503f?auto=format&fit=crop&q=80&w=800'],
                            description: 'Augmented reality smart eyewear with real-time HUD, spatial audio, and titanium alloy frame.'
                        },
                        {
                            title: 'Aero-Grid Levitating Sneakers',
                            category: 'footwear',
                            price: 8999,
                            comparePrice: 12999,
                            rating: 4.7,
                            reviewCount: 210,
                            stock: 25,
                            isFeatured: true,
                            isFlashDeal: false,
                            images: ['https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&q=80&w=800'],
                            description: 'Next-generation shock-absorbing sneakers crafted with carbon-fiber plates and responsive foam.'
                        },
                        {
                            title: 'Quantum RGB Mech Keyboard',
                            category: 'tech',
                            price: 5499,
                            comparePrice: 7499,
                            rating: 4.9,
                            reviewCount: 340,
                            stock: 30,
                            isFeatured: true,
                            isFlashDeal: true,
                            images: ['https://images.unsplash.com/photo-1587829741301-dc798b83add3?auto=format&fit=crop&q=80&w=800'],
                            description: 'Hot-swappable wireless mechanical keyboard with customizable OLED display and infinite macro mapping.'
                        }
                    ];
                    for (const p of defaultProducts) {
                        await addDoc(collection(db, 'products'), p);
                    }
                }

                const bannerSnap = await getDocs(collection(db, 'banners'));
                if (bannerSnap.empty) {
                    await addDoc(collection(db, 'banners'), {
                        title: 'FUTURE COMMERCE IS HERE',
                        subtitle: 'Explore next-gen streetwear, cyber tech & holographic collectibles.',
                        buttonText: 'Shop Drop #01',
                        link: 'shop',
                        image: 'https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?auto=format&fit=crop&q=80&w=1400',
                        active: true
                    });
                }
            } catch (err) {
                console.error("Error initializing defaults:", err);
            }
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                state.user = user;
                state.isOwner = (user.email === OWNER_EMAIL);
                
                const userRef = doc(db, 'users', user.uid);
                const userSnap = await getDoc(userRef);
                if (!userSnap.exists()) {
                    await setDoc(userRef, {
                        uid: user.uid,
                        name: user.displayName || 'TrendPro User',
                        email: user.email,
                        photoURL: user.photoURL || 'https://placehold.co/200x200/7c3aed/ffffff?text=User',
                        phone: user.phoneNumber || '',
                        createdAt: new Date().toISOString()
                    });
                }

                const walletRef = doc(db, 'wallets', user.uid);
                const walletSnap = await getDoc(walletRef);
                if (walletSnap.exists()) {
                    state.wallet = walletSnap.data();
                } else {
                    const initialWallet = { balance: 500, transactions: [{ id: 'TXN-WELCOME', amount: 500, type: 'credit', date: new Date().toISOString(), description: 'Welcome Bonus Credited' }] };
                    await setDoc(walletRef, initialWallet);
                    state.wallet = initialWallet;
                }

                loadUserAddresses();
            } else {
                state.user = null;
                state.isOwner = false;
            }

            setupRealtimeListeners();
            renderApp();
        });

        function setupRealtimeListeners() {
            onSnapshot(collection(db, 'products'), (snapshot) => {
                state.products = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                renderApp();
            });

            onSnapshot(collection(db, 'categories'), (snapshot) => {
                state.categories = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                renderApp();
            });

            onSnapshot(collection(db, 'banners'), (snapshot) => {
                state.banners = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                renderApp();
            });

            if (state.user) {
                const ordersQuery = state.isOwner ? collection(db, 'orders') : query(collection(db, 'orders'), where('uid', '==', state.user.uid));
                onSnapshot(ordersQuery, (snapshot) => {
                    state.orders = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                    renderApp();
                });

                const chatsQuery = state.isOwner ? collection(db, 'chats') : query(collection(db, 'chats'), where('uid', '==', state.user.uid));
                onSnapshot(chatsQuery, (snapshot) => {
                    state.chats = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                    renderApp();
                });
            }
        }

        async function loadUserAddresses() {
            if (!state.user) return;
            try {
                const addrSnap = await getDocs(collection(db, 'users', state.user.uid, 'addresses'));
                state.addresses = addrSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderApp();
            } catch (err) {
                console.error("Error loading addresses:", err);
            }
        }

        window.loginWithGoogle = async function() {
            try {
                const result = await signInWithPopup(auth, googleProvider);
                showToast(`Welcome back, ${result.user.displayName}!`, 'success');
                navigate('home');
            } catch (err) {
                console.error("Login error:", err);
                showToast("Google Authentication failed.", "error");
            }
        };

        window.logoutUser = async function() {
            showModal("Confirm Logout", "Are you sure you want to sign out of TrendPro?", `
                <button onclick="closeModal()" class="px-4 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-white font-medium transition-all">Cancel</button>
                <button onclick="confirmLogout()" class="px-5 py-2 rounded-xl bg-rose-600 text-white font-semibold hover:bg-rose-700 transition-all shadow-lg shadow-rose-500/30">Sign Out</button>
            `);
        };

        window.confirmLogout = async function() {
            closeModal();
            await signOut(auth);
            state.user = null;
            state.isOwner = false;
            showToast("Successfully signed out.", "info");
            navigate('home');
        };

        window.navigate = function(route, params = {}) {
            state.currentRoute = route;
            state.routeParams = params;
            window.location.hash = route;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            renderApp();
        };

        window.addEventListener('hashchange', () => {
            const hash = window.location.hash.substring(1) || 'home';
            if (hash !== state.currentRoute) {
                state.currentRoute = hash;
                renderApp();
            }
        });

        function renderApp() {
            renderHeader();
            renderFooter();
            renderMobileNav();
            renderMainContent();
        }

        function renderHeader() {
            const header = document.getElementById('main-header');
            const cartCount = state.cart.reduce((sum, item) => sum + item.qty, 0);
            const wishlistCount = state.wishlist.length;

            header.innerHTML = `
                <div class="container mx-auto px-4 py-3 flex items-center justify-between gap-4">
                    <div class="flex items-center gap-6">
                        <a href="#home" onclick="navigate('home'); return false;" class="flex items-center gap-2 font-extrabold text-2xl tracking-tighter">
                            <div class="w-10 h-10 rounded-xl gradient-bg flex items-center justify-center text-white shadow-lg shadow-purple-500/30 animate-float">
                                <i class="fa-solid fa-bolt-lightning text-lg"></i>
                            </div>
                            <span class="gradient-text font-black text-3xl">TRENDPRO</span>
                        </a>
                        <nav class="hidden lg:flex items-center gap-6 font-semibold text-sm text-gray-300">
                            <a href="#home" onclick="navigate('home'); return false;" class="hover:text-purple-400 transition-colors ${state.currentRoute === 'home' ? 'text-purple-400 font-bold' : ''}">Home</a>
                            <a href="#shop" onclick="navigate('shop'); return false;" class="hover:text-purple-400 transition-colors ${state.currentRoute === 'shop' ? 'text-purple-400 font-bold' : ''}">Shop</a>
                            <a href="#categories" onclick="navigate('categories'); return false;" class="hover:text-purple-400 transition-colors ${state.currentRoute === 'categories' ? 'text-purple-400 font-bold' : ''}">Categories</a>
                            <a href="#about" onclick="navigate('about'); return false;" class="hover:text-purple-400 transition-colors ${state.currentRoute === 'about' ? 'text-purple-400 font-bold' : ''}">About</a>
                            ${state.isOwner ? `<a href="#owner/dashboard" onclick="navigate('owner/dashboard'); return false;" class="px-3 py-1 rounded-lg bg-gradient-to-r from-purple-600 to-pink-600 text-white font-bold animate-pulse"><i class="fa-solid fa-shield-halved mr-1"></i> Owner Center</a>` : ''}
                        </nav>
                    </div>

                    <div class="hidden md:flex items-center flex-1 max-w-md mx-4">
                        <div class="relative w-full">
                            <input type="text" id="global-search" placeholder="Search futuristic drops, tech, hoodies..." value="${state.searchQuery}" oninput="handleSearchInput(event)" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2 pl-10 text-sm text-white placeholder-gray-400 focus:outline-none focus:border-purple-500 transition-all">
                            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-gray-400 text-sm"></i>
                        </div>
                    </div>

                    <div class="flex items-center gap-3">
                        <button onclick="navigate('wishlist')" class="relative p-2.5 rounded-xl glass-card hover:text-purple-400 transition-colors text-gray-300">
                            <i class="fa-regular fa-heart text-lg"></i>
                            ${wishlistCount > 0 ? `<span class="absolute -top-1 -right-1 w-5 h-5 rounded-full bg-pink-500 text-white text-xs font-bold flex items-center justify-center shadow-md">${wishlistCount}</span>` : ''}
                        </button>
                        <button onclick="navigate('cart')" class="relative p-2.5 rounded-xl glass-card hover:text-purple-400 transition-colors text-gray-300">
                            <i class="fa-solid fa-bag-shopping text-lg"></i>
                            ${cartCount > 0 ? `<span class="absolute -top-1 -right-1 w-5 h-5 rounded-full bg-purple-600 text-white text-xs font-bold flex items-center justify-center shadow-md">${cartCount}</span>` : ''}
                        </button>

                        ${state.user ? `
                            <div class="relative group">
                                <button onclick="navigate('profile')" class="flex items-center gap-2 p-1.5 rounded-xl glass-card hover:border-purple-500 transition-all">
                                    <img src="${state.user.photoURL}" alt="Profile" class="w-8 h-8 rounded-lg object-cover">
                                    <span class="hidden xl:inline text-sm font-semibold text-gray-200 pr-1">${state.user.displayName ? state.user.displayName.split(' ')[0] : 'Account'}</span>
                                </button>
                            </div>
                        ` : `
                            <button onclick="loginWithGoogle()" class="flex items-center gap-2 px-5 py-2.5 rounded-xl gradient-bg text-white font-bold text-sm shadow-lg shadow-purple-500/30 hover:opacity-95 transition-all">
                                <i class="fa-brands fa-google"></i><span>Google Sign-In</span>
                            </button>
                        `}
                    </div>
                </div>
            `;
        }

        function renderMobileNav() {
            const nav = document.getElementById('mobile-nav');
            const cartCount = state.cart.reduce((sum, item) => sum + item.qty, 0);
            nav.innerHTML = `
                <a href="#home" onclick="navigate('home'); return false;" class="flex flex-col items-center gap-1 ${state.currentRoute === 'home' ? 'text-purple-400' : 'text-gray-400'}">
                    <i class="fa-solid fa-house text-lg"></i><span>Home</span>
                </a>
                <a href="#shop" onclick="navigate('shop'); return false;" class="flex flex-col items-center gap-1 ${state.currentRoute === 'shop' ? 'text-purple-400' : 'text-gray-400'}">
                    <i class="fa-solid fa-store text-lg"></i><span>Shop</span>
                </a>
                <a href="#categories" onclick="navigate('categories'); return false;" class="flex flex-col items-center gap-1 ${state.currentRoute === 'categories' ? 'text-purple-400' : 'text-gray-400'}">
                    <i class="fa-solid fa-layer-group text-lg"></i><span>Categories</span>
                </a>
                <a href="#cart" onclick="navigate('cart'); return false;" class="relative flex flex-col items-center gap-1 ${state.currentRoute === 'cart' ? 'text-purple-400' : 'text-gray-400'}">
                    <i class="fa-solid fa-bag-shopping text-lg"></i><span>Cart</span>
                    ${cartCount > 0 ? `<span class="absolute -top-1 right-2 w-4 h-4 rounded-full bg-purple-600 text-white text-[10px] font-bold flex items-center justify-center">${cartCount}</span>` : ''}
                </a>
                <a href="#profile" onclick="navigate('profile'); return false;" class="flex flex-col items-center gap-1 ${state.currentRoute === 'profile' ? 'text-purple-400' : 'text-gray-400'}">
                    <i class="fa-solid fa-user text-lg"></i><span>Profile</span>
                </a>
            `;
        }

        function renderFooter() {
            const footer = document.getElementById('main-footer');
            footer.innerHTML = `
                <div class="container mx-auto px-4 grid grid-cols-1 md:grid-cols-4 gap-8 mb-8">
                    <div>
                        <div class="flex items-center gap-2 font-extrabold text-2xl tracking-tighter mb-4">
                            <div class="w-8 h-8 rounded-lg gradient-bg flex items-center justify-center text-white">
                                <i class="fa-solid fa-bolt-lightning"></i>
                            </div>
                            <span class="gradient-text font-black text-2xl">TRENDPRO</span>
                        </div>

                    state.wishlist.push(prod);

                }
            }
            localStorage.setItem('trendpro_wishlist', JSON.stringify(state.wishlist));
            renderApp();
        };

        window.addToCart = function(id) {
            const prod = state.products.find(p => p.id === id);
            if (!prod) return;
            const existing = state.cart.find(item => item.id === id);
            if (existing) {
                existing.qty += 1;
            } else {
                state.cart.push({ ...prod, qty: 1 });
            }
            localStorage.setItem('trendpro_cart', JSON.stringify(state.cart));
            showToast(`${prod.title} added to cart!`, "success");
            renderApp();
        };

        window.placeOrder = async function() {
            if (state.addresses.length === 0) {
                showToast("Please add a delivery address first.", "error");
                navigate('addresses');
                return;
            }
            const selectedAddrInput = document.querySelector('input[name="selectedAddress"]:checked');
            const selectedAddressId = selectedAddrInput ? selectedAddrInput.value : state.addresses[0].id;
            const address = state.addresses.find(a => a.id === selectedAddressId);

            const subtotal = state.cart.reduce((s, i) => s + (i.price * i.qty), 0);
            const orderId = 'TP-' + new Date().getFullYear() + '-' + Math.floor(100000 + Math.random() * 900000);

            const newOrder = {
                orderId,
                uid: state.user.uid,
                customerName: state.user.displayName,
                customerEmail: state.user.email,
                items: state.cart,
                amount: subtotal,
                address,
                status: 'Order Placed',
                statusHistory: [{ status: 'Order Placed', timestamp: new Date().toISOString() }],
                createdAt: new Date().toISOString()
            };

            try {
                await addDoc(collection(db, 'orders'), newOrder);
                state.cart = [];
                localStorage.removeItem('trendpro_cart');
                showToast("Order placed successfully!", "success");
                navigate('order-success');
            } catch (err) {
                console.error("Error placing order:", err);
                showToast("Failed to place order.", "error");
            }
        };

        window.sendChatMessage = async function() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';

            const newMessage = {
                senderId: state.user.uid,
                senderName: state.user.displayName,
                text,
                timestamp: new Date().toISOString()
            };

            try {
                let chat = state.chats.find(c => c.uid === state.user.uid);
                if (chat) {
                    const updatedMessages = [...(chat.messages || []), newMessage];
                    await updateDoc(doc(db, 'chats', chat.id), { messages: updatedMessages, lastMessage: text, updatedAt: new Date().toISOString() });
                } else {
                    await addDoc(collection(db, 'chats'), {
                        uid: state.user.uid,
                        customerName: state.user.displayName,
                        customerEmail: state.user.email,
                        messages: [newMessage],
                        lastMessage: text,
                        updatedAt: new Date().toISOString()
                    });
                }
            } catch (err) {
                console.error("Error sending message:", err);
                showToast("Failed to send message.", "error");
            }
        };

        window.sendChatAttachment = async function(e) {
            const file = e.target.files[0];
            if (!file) return;
            try {
                const storageRef = ref(storage, `chats/${state.user.uid}/${file.name}`);
                await uploadBytes(storageRef, file);
                const fileUrl = await getDownloadURL(storageRef);

                const newMessage = {
                    senderId: state.user.uid,
                    senderName: state.user.displayName,
                    text: `[Attachment: ${file.name}]`,
                    fileUrl,
                    timestamp: new Date().toISOString()
                };

                let chat = state.chats.find(c => c.uid === state.user.uid);
                if (chat) {
                    const updatedMessages = [...(chat.messages || []), newMessage];
                    await updateDoc(doc(db, 'chats', chat.id), { messages: updatedMessages, lastMessage: `[Attachment]`, updatedAt: new Date().toISOString() });

                        customerEmail: state.user.email,
                        messages: [newMessage],
                        lastMessage: `[Attachment]`,
                        updatedAt: new Date().toISOString()
                    });
                }
                showToast("Attachment sent!", "success");
            } catch (err) {
                console.error("Error uploading attachment:", err);
                showToast("Failed to upload attachment.", "error");
            }
        };

                            </div>
                        `).join('')}
                    </div>
                    <div class="md:col-span-2 glass-panel rounded-3xl p-6 flex flex-col justify-between">
                        ${activeChat ? `
                            <div class="border-b border-white/10 pb-4 mb-4">
                                <h3 class="font-bold text-white text-base">${activeChat.customerName}</h3>
                                <p class="text-xs text-gray-400">${activeChat.customerEmail}</p>
                            </div>
                            <div class="flex-grow overflow-y-auto space-y-4 pr-2 flex flex-col">
                                ${activeChat.messages ? activeChat.messages.map(m => `
                                    <div class="flex ${m.senderId === state.user.uid ? 'justify-end' : 'justify-start'}">
                                        <div class="max-w-[75%] rounded-2xl p-4 ${m.senderId === state.user.uid ? 'gradient-bg text-white rounded-br-none' : 'glass-card text-gray-200 rounded-bl-none'}">
                                            <p class="text-sm">${m.text}</p>
                                            ${m.fileUrl ? `<a href="${m.fileUrl}" target="_blank" class="block mt-2"><img src="${m.fileUrl}" class="w-48 h-32 object-cover rounded-xl"></a>` : ''}
                                            <span class="block text-[10px] opacity-70 mt-1 text-right">${new Date(m.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                                        </div>
                                    </div>
                                `).join('') : ''}
                            </div>
                            <div class="pt-4 border-t border-white/10 flex items-center gap-3">
                                <input type="text" id="owner-chat-input" placeholder="Type reply..." onkeypress="if(event.key==='Enter') sendOwnerChatMessage('${activeChat.id}')" class="flex-grow bg-white/5 border border-white/10 rounded-2xl px-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-purple-500">
                                <button onclick="sendOwnerChatMessage('${activeChat.id}')" class="p-3 rounded-2xl gradient-bg text-white font-bold shadow-lg"><i class="fa-solid fa-paper-plane"></i></button>
                            </div>
                        ` : `<div class="text-center my-auto text-gray-500">Select a conversation to start chatting</div>`}
                    </div>
                </div>
            `;
        }

        window.sendOwnerChatMessage = async function(chatId) {
            const input = document.getElementById('owner-chat-input');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';

            const newMessage = {
                senderId: state.user.uid,
                senderName: state.user.displayName,
                text,
                timestamp: new Date().toISOString()
            };

            try {
                const chat = state.chats.find(c => c.id === chatId);
                if (chat) {
                    const updatedMessages = [...(chat.messages || []), newMessage];
                    await updateDoc(doc(db, 'chats', chatId), { messages: updatedMessages, lastMessage: text, updatedAt: new Date().toISOString() });
                }
            } catch (err) {
                console.error("Error sending owner message:", err);
            }
        };

        window.onload = async function() {
            await initializeDatabaseDefaults();
            const hash = window.location.hash.substring(1) || 'home';
            navigate(hash);
        };
    </script>
</body>
</html>
