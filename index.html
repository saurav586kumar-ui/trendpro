<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrendPro - Advanced Ecommerce</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 900: '#1e3a8a' },
                        dark: { 800: '#1f2937', 900: '#111827' }
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; color: #1f2937; margin: 0; overflow-x: hidden; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        .animate-slide-up { animation: slideUp 0.4s ease-out; }
        .animate-slide-in-right { animation: slideInRight 0.3s ease-out; }
        .animate-spin-slow { animation: spin 2s linear infinite; }

        /* Glassmorphism & UI Elements */
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .card { background: #ffffff; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03); border: 1px solid #f3f4f6; transition: all 0.2s ease; }
        .card:hover { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); transform: translateY(-2px); }
        
        /* Input Styling */
        .input-field { width: 100%; padding: 0.75rem 1rem; border-radius: 8px; border: 1px solid #d1d5db; outline: none; transition: border-color 0.2s, box-shadow 0.2s; background-color: #f9fafb; }
        .input-field:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); background-color: #ffffff; }
        .label { display: block; font-size: 0.875rem; font-weight: 500; color: #374151; margin-bottom: 0.25rem; }

        /* Timeline CSS */
        .timeline-container { position: relative; padding-left: 1.5rem; }
        .timeline-container::before { content: ''; position: absolute; left: 0.375rem; top: 0.5rem; bottom: 0; width: 2px; background: #e5e7eb; }
        .timeline-item { position: relative; padding-bottom: 1.5rem; }
        .timeline-item:last-child { padding-bottom: 0; }
        .timeline-dot { position: absolute; left: -1.5rem; top: 0.25rem; width: 0.875rem; height: 0.875rem; border-radius: 50%; background: #e5e7eb; border: 2px solid #fff; z-index: 10; }
        .timeline-item.active .timeline-dot { background: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
        .timeline-item.completed .timeline-dot { background: #10b981; }

        /* Toast */
        #toast-container { position: fixed; bottom: 1rem; right: 1rem; z-index: 9999; display: flex; flex-direction: column; gap: 0.5rem; }
        .toast { padding: 1rem; border-radius: 8px; background: white; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 0.75rem; min-width: 300px; transform: translateX(120%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .toast.show { transform: translateX(0); }

        /* Image Uploader */
        .image-drop-zone { border: 2px dashed #d1d5db; border-radius: 12px; padding: 2rem; text-align: center; cursor: pointer; transition: background 0.2s; }
        .image-drop-zone:hover, .image-drop-zone.dragover { background: #f3f4f6; border-color: #3b82f6; }
        
        /* Loader */
        .skeleton { background: linear-gradient(90deg, #f3f4f6 25%, #e5e7eb 50%, #f3f4f6 75%); background-size: 200% 100%; animation: skeleton-loading 1.5s infinite; border-radius: 4px; }
        @keyframes skeleton-loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* Hide elements helper */
        .hidden { display: none !important; }
    </style>
</head>
<body class="text-gray-800 antialiased h-screen flex flex-col overflow-hidden">

    <!-- App Mount Point -->
    <div id="app" class="h-full w-full flex flex-col">
        <!-- Initial Loader -->
        <div class="flex-1 flex items-center justify-center bg-gray-50 h-full w-full absolute inset-0 z-50 transition-opacity duration-500" id="initial-loader">
            <div class="text-center">
                <i class="ph ph-shopping-bag text-5xl text-brand-600 mb-4 animate-bounce"></i>
                <h1 class="text-2xl font-bold text-gray-800 tracking-tight">TrendPro</h1>
                <p class="text-gray-500 mt-2 flex items-center justify-center gap-2">
                    <i class="ph ph-spinner animate-spin-slow"></i> Initializing System...
                </p>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- Modal Container -->
    <div id="modal-container" class="fixed inset-0 bg-gray-900/50 backdrop-blur-sm z-[100] hidden items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div id="modal-content" class="bg-white rounded-xl shadow-2xl w-full max-w-md scale-95 transition-transform duration-300 transform">
            <!-- Modal content injected here -->
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged, signInWithCustomToken, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, getDocs, onSnapshot, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

        // --- Configuration ---
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'trendpro-ecommerce-app';
        let firebaseConfig = null;
        try {
            firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
        } catch(e) { console.error("Error parsing firebase config", e); }

        // Fallback for development outside immersive environment
        if (!firebaseConfig) {
             firebaseConfig = {
                // Mock config - in a real scenario this requires valid Firebase credentials
                projectId: "demo-project"
            };
        }

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);
        const provider = new GoogleAuthProvider();

        const ADMIN_EMAIL = 'saurav586kumar@gmail.com';

        // --- Global State ---
        const state = {
            user: null,
            isAdmin: false,
            currentView: 'loading',
            products: [],
            orders: [],
            cart: [],
            customers: [],
            notifications: [],
            productFormDraft: null,
            unsubscribes: [],
            aiChatHistory: [] // Added for AI Assistant
        };

        // --- Utility Functions ---
        const $ = id => document.getElementById(id);
        
        const showToast = (message, type = 'success') => {
            const container = $('toast-container');
            const toast = document.createElement('div');
            const icon = type === 'success' ? '<i class="ph-fill ph-check-circle text-green-500 text-xl"></i>' : 
                         type === 'error' ? '<i class="ph-fill ph-warning-circle text-red-500 text-xl"></i>' : 
                         '<i class="ph-fill ph-info text-blue-500 text-xl"></i>';
            toast.className = `toast`;
            toast.innerHTML = `${icon} <span class="text-sm font-medium text-gray-700">${message}</span>`;
            container.appendChild(toast);
            
            // Trigger animation
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        const generateId = (prefix = 'TP') => {
            return `${prefix}-${Date.now().toString(36).toUpperCase()}-${Math.random().toString(36).substring(2, 6).toUpperCase()}`;
        };

        const formatCurrency = (amount) => {
            return new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(amount);
        };

        // --- Gemini AI Integration ---
        const callGemini = async (input, systemInstruction = null) => {
            const apiKey = ""; // API key is handled automatically by the environment
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            // Handle either a single string prompt or a conversation history array
            let contents = [];
            if (typeof input === 'string') {
                contents = [{ role: 'user', parts: [{ text: input }] }];
            } else if (Array.isArray(input)) {
                contents = input;
            }

            const payload = { contents };
            if (systemInstruction) {
                payload.systemInstruction = { parts: [{ text: systemInstruction }] };
            }

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if(!response.ok) throw new Error("Gemini API Error");
                const result = await response.json();
                return result.candidates?.[0]?.content?.parts?.[0]?.text || "I'm not sure how to respond to that.";
            } catch (error) {
                console.error("Gemini API Call Failed:", error);
                throw error;
            }
        };

        const formatDate = (timestamp) => {
            if(!timestamp) return 'N/A';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return date.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        };

        // Modal System
        const Modal = {
            show: (contentHTML) => {
                const modal = $('modal-container');
                const content = $('modal-content');
                content.innerHTML = contentHTML;
                modal.classList.remove('hidden');
                modal.classList.add('flex');
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                    content.classList.remove('scale-95');
                }, 10);
            },
            hide: () => {
                const modal = $('modal-container');
                const content = $('modal-content');
                modal.classList.add('opacity-0');
                content.classList.add('scale-95');
                setTimeout(() => {
                    modal.classList.add('hidden');
                    modal.classList.remove('flex');
                    content.innerHTML = '';
                }, 300);
            },
            confirm: (title, message, confirmText, confirmCallback, isDanger = false) => {
                const btnColor = isDanger ? 'bg-red-600 hover:bg-red-700' : 'bg-brand-600 hover:bg-brand-700';
                Modal.show(`
                    <div class="p-6">
                        <h3 class="text-lg font-bold text-gray-900 mb-2">${title}</h3>
                        <p class="text-gray-600 mb-6">${message}</p>
                        <div class="flex justify-end gap-3">
                            <button onclick="window.TrendPro.Modal.hide()" class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 rounded-lg hover:bg-gray-200 transition">Cancel</button>
                            <button id="modal-confirm-btn" class="px-4 py-2 text-sm font-medium text-white ${btnColor} rounded-lg transition">${confirmText}</button>
                        </div>
                    </div>
                `);
                $('modal-confirm-btn').addEventListener('click', () => {
                    confirmCallback();
                    Modal.hide();
                });
            }
        };
        // Expose Modal to window for inline HTML handlers
        window.TrendPro = { Modal };

        // --- Authentication & Initialization ---
        const initAuth = async () => {
            // Check for initial token from system
            const initialToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
            
            onAuthStateChanged(auth, async (user) => {
                const loader = $('initial-loader');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 500);
                }

                if (user) {
                    state.user = user;
                    state.isAdmin = user.email === ADMIN_EMAIL;
                    
                    // Save/Update user profile
                    await setDoc(PATHS.userDoc(user.uid), {
                        uid: user.uid,
                        name: user.displayName || 'Anonymous User',
                        email: user.email || 'N/A',
                        photoURL: user.photoURL || '',
                        lastLogin: serverTimestamp(),
                        role: state.isAdmin ? 'admin' : 'customer'
                    }, { merge: true });

                    setupRealtimeListeners();
                    
                    // Route based on role
                    if (state.isAdmin) {
                        navigate('admin-dashboard');
                    } else {
                        navigate('storefront');
                    }
                } else {
                    state.user = null;
                    state.isAdmin = false;
                    cleanupListeners();
                    renderLogin();
                }
            });

            if (!auth.currentUser) {
                if (initialToken) {
                    try {
                        await signInWithCustomToken(auth, initialToken);
                    } catch (e) {
                        console.error("Custom token failed, falling back to anon", e);
                        await signInAnonymously(auth);
                    }
                }
            }
        };

        const handleLogin = async () => {
            try {
                // In an iframe/immersive env, popup might be blocked. Using anonymous if popup fails.
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error("Popup login failed, attempting anonymous", error);
                await signInAnonymously(auth);
                showToast("Logged in anonymously (Popup blocked)", "info");
            }
        };

        const handleLogout = () => {
            signOut(auth);
        };

        // --- Data Listeners ---
        const setupRealtimeListeners = () => {
            cleanupListeners(); // Prevent duplicates

            // Listen to Products (Everyone needs this)
            const unsubProducts = onSnapshot(PATHS.publicProducts(), (snapshot) => {
                state.products = [];
                snapshot.forEach(doc => state.products.push({ id: doc.id, ...doc.data() }));
                updateCurrentViewData();
            }, (err) => console.error("Products listener error:", err));
            state.unsubscribes.push(unsubProducts);

            // Listen to Orders (Admin sees all, Customer sees theirs)
            if(state.isAdmin) {
                const unsubOrders = onSnapshot(PATHS.publicOrders(), (snapshot) => {
                    state.orders = [];
                    snapshot.forEach(doc => state.orders.push({ id: doc.id, ...doc.data() }));
                    // Sort descending by date in memory (Rule 2 workaround)
                    state.orders.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
                    updateCurrentViewData();
                }, (err) => console.error("Admin orders listener error:", err));
                state.unsubscribes.push(unsubOrders);

                // Listen to Customers
                const unsubCustomers = onSnapshot(PATHS.publicUsers(), (snapshot) => {
                    state.customers = [];
                    snapshot.forEach(doc => state.customers.push({ id: doc.id, ...doc.data() }));
                    updateCurrentViewData();
                });
                state.unsubscribes.push(unsubCustomers);

            } else {
                // Customer Order Listener (Filtering client-side for sandbox simplicity, ideally queried by UID)
                const unsubOrders = onSnapshot(PATHS.publicOrders(), (snapshot) => {
                    state.orders = [];
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        if(data.customerId === state.user.uid) {
                            state.orders.push({ id: doc.id, ...data });
                        }
                    });
                    state.orders.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
                    updateCurrentViewData();
                });
                state.unsubscribes.push(unsubOrders);
            }
        };

        const cleanupListeners = () => {
            state.unsubscribes.forEach(unsub => unsub());
            state.unsubscribes = [];
        };

        const updateCurrentViewData = () => {
            // Re-render current view if data changes
            if(state.currentView.startsWith('admin-')) renderAdminContent(state.currentView);
            else if(state.currentView === 'storefront') renderStorefront();
        };

        // --- Navigation & Routing ---
        const navigate = (view, params = null) => {
            state.currentView = view;
            state.viewParams = params;
            
            const appDiv = $('app');
            appDiv.innerHTML = ''; // Clear

            if (view === 'login') {
                renderLogin();
            } else if (view.startsWith('admin-')) {
                if(!state.isAdmin) { navigate('storefront'); return; }
                renderAdminShell();
                renderAdminContent(view, params);
            } else {
                renderCustomerShell();
                if(view === 'storefront') renderStorefront();
                // Add checkout/cart views here later
            }
        };

        // --- View Rendering: Login ---
        const renderLogin = () => {
            $('app').innerHTML = `
                <div class="h-full flex items-center justify-center bg-gray-900 bg-[url('https://images.unsplash.com/photo-1557821552-17105176677c?q=80&w=2000&auto=format&fit=crop')] bg-cover bg-center">
                    <div class="absolute inset-0 bg-gray-900/70 backdrop-blur-sm"></div>
                    <div class="z-10 bg-white p-8 rounded-2xl shadow-2xl max-w-md w-full mx-4 animate-slide-up text-center">
                        <div class="w-16 h-16 bg-brand-100 rounded-2xl flex items-center justify-center mx-auto mb-6 transform rotate-3">
                            <i class="ph ph-shopping-bag text-3xl text-brand-600"></i>
                        </div>
                        <h1 class="text-3xl font-bold text-gray-900 tracking-tight mb-2">TrendPro</h1>
                        <p class="text-gray-500 mb-8 text-sm">Advanced E-commerce Management</p>
                        
                        <button id="btn-login-google" class="w-full flex items-center justify-center gap-3 bg-white border border-gray-300 rounded-xl px-4 py-3 text-gray-700 font-medium hover:bg-gray-50 hover:shadow-md transition duration-200">
                            <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                            Continue with Google
                        </button>
                        <div class="mt-6 text-xs text-gray-400">
                            Admin access requires specific authorization.<br>
                            Customer view available for all other accounts.
                        </div>
                    </div>
                </div>
            `;
            $('btn-login-google').addEventListener('click', handleLogin);
        };

        // --- View Rendering: Admin Shell ---
        const renderAdminShell = () => {
            const shellHTML = `
                <div class="flex h-screen bg-gray-50 overflow-hidden">
                    <!-- Sidebar (Desktop) -->
                    <aside class="hidden md:flex flex-col w-64 bg-white border-r border-gray-200 z-20">
                        <div class="h-16 flex items-center px-6 border-b border-gray-200">
                            <i class="ph-fill ph-shopping-bag text-brand-600 text-2xl mr-2"></i>
                            <span class="text-xl font-bold text-gray-900 tracking-tight">TrendPro</span>
                            <span class="ml-2 text-[10px] uppercase font-bold tracking-wider bg-brand-100 text-brand-700 py-1 px-2 rounded">Owner</span>
                        </div>
                        <nav class="flex-1 overflow-y-auto py-4 space-y-1 px-3" id="admin-nav">
                            ${getAdminNavItems()}
                        </nav>
                        <div class="p-4 border-t border-gray-200">
                            <div class="flex items-center gap-3 mb-4">
                                <img src="${state.user.photoURL || 'https://ui-avatars.com/api/?name=Admin&background=random'}" class="w-10 h-10 rounded-full border border-gray-200">
                                <div class="overflow-hidden">
                                    <p class="text-sm font-medium text-gray-900 truncate">${state.user.name}</p>
                                    <p class="text-xs text-gray-500 truncate">${state.user.email}</p>
                                </div>
                            </div>
                            <button id="btn-logout" class="w-full flex items-center justify-center gap-2 text-sm text-red-600 bg-red-50 hover:bg-red-100 py-2 rounded-lg transition">
                                <i class="ph ph-sign-out"></i> Logout
                            </button>
                        </div>
                    </aside>

                    <!-- Main Content -->
                    <div class="flex-1 flex flex-col h-screen overflow-hidden relative">
                        <!-- Mobile Header -->
                        <header class="md:hidden h-16 bg-white border-b border-gray-200 flex items-center justify-between px-4 z-20">
                            <div class="flex items-center">
                                <i class="ph-fill ph-shopping-bag text-brand-600 text-xl mr-2"></i>
                                <span class="text-lg font-bold">TrendPro</span>
                            </div>
                            <button id="btn-mobile-menu" class="p-2 text-gray-600 bg-gray-100 rounded-lg"><i class="ph ph-list text-xl"></i></button>
                        </header>

                        <!-- Mobile Drawer Overlay -->
                        <div id="mobile-drawer-overlay" class="fixed inset-0 bg-gray-900/50 z-40 hidden transition-opacity opacity-0"></div>
                        
                        <!-- Mobile Drawer -->
                        <aside id="mobile-drawer" class="fixed inset-y-0 left-0 w-64 bg-white z-50 transform -translate-x-full transition-transform duration-300 flex flex-col">
                            <div class="h-16 flex items-center justify-between px-6 border-b border-gray-200">
                                <span class="text-xl font-bold">Menu</span>
                                <button id="btn-close-drawer" class="p-2 text-gray-500 hover:bg-gray-100 rounded"><i class="ph ph-x"></i></button>
                            </div>
                            <nav class="flex-1 overflow-y-auto py-4 space-y-1 px-3" id="admin-nav-mobile">
                                ${getAdminNavItems()}
                            </nav>
                        </aside>

                        <!-- Dynamic Content Area -->
                        <main id="admin-main-content" class="flex-1 overflow-y-auto p-4 md:p-8 bg-gray-50 relative"></main>
                    </div>
                </div>
            `;
            $('app').innerHTML = shellHTML;

            // Event Listeners for Shell
            $('btn-logout').addEventListener('click', handleLogout);
            
            // Mobile Menu Logic
            const drawer = $('mobile-drawer');
            const overlay = $('mobile-drawer-overlay');
            const toggleDrawer = (show) => {
                if(show) {
                    overlay.classList.remove('hidden');
                    setTimeout(() => { overlay.classList.remove('opacity-0'); drawer.classList.remove('-translate-x-full'); }, 10);
                } else {
                    overlay.classList.add('opacity-0');
                    drawer.classList.add('-translate-x-full');
                    setTimeout(() => overlay.classList.add('hidden'), 300);
                }
            };

            $('btn-mobile-menu').addEventListener('click', () => toggleDrawer(true));
            $('btn-close-drawer').addEventListener('click', () => toggleDrawer(false));
            overlay.addEventListener('click', () => toggleDrawer(false));

            // Setup Navigation Listeners
            document.querySelectorAll('.admin-nav-link').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    toggleDrawer(false);
                    const view = e.currentTarget.dataset.view;
                    navigate(view);
                });
            });
        };

        const getAdminNavItems = () => {
            const items = [
                { id: 'admin-dashboard', icon: 'squares-four', label: 'Dashboard' },
                { id: 'admin-products', icon: 'package', label: 'Products' },

                <div class="animate-fade-in max-w-6xl mx-auto pb-20">

                            <!-- Basic Info -->

            // Form Logic
            const formState = { images: [...product.images], newFiles: [] };

            const calcDiscount = () => {
                const mrp = parseFloat($('pf-mrp').value) || 0;
                const sp = parseFloat($('pf-price').value) || 0;
                let perc = 0;
                if(mrp > sp && mrp > 0) perc = Math.round(((mrp - sp) / mrp) * 100);
                $('pf-discount-display').innerText = `${perc}% OFF`;

            $('pf-mrp').addEventListener('input', calcDiscount);
            $('pf-price').addEventListener('input', calcDiscount);

            $('btn-ai-desc').addEventListener('click', async () => {
                const name = $('pf-name').value.trim();
                const category = $('pf-cat').value.trim();

                    showToast('AI Description Generated!', 'success');

                    `;

                const files = Array.from(e.target.files);
                files.forEach(file => {

                    ).join('\n');

                    const systemInstruction = `You are the friendly AI shopping assistant for TrendPro Ecommerce. 
                    Be concise, helpful, and polite. 
                    If a user asks about products, recommend items ONLY from the active catalog below. 
                    Current Active Catalog:\n${catalogSummary || 'No products currently available.'}\n
                    General store rules: Standard shipping is free and takes 3-5 days. Do not make up product details or prices that aren't listed. Keep responses under 3-4 short sentences.`;

                    const reply = await callGemini(state.aiChatHistory, systemInstruction);
                    
                    // Add AI reply to history
                    state.aiChatHistory.push({ role: 'model', parts: [{ text: reply }] });
                    
                    // Display
                    document.getElementById(loadingId)?.remove();
                    appendMessage(reply, false);

                } catch (error) {
                    document.getElementById(loadingId)?.remove();
                    appendMessage("I'm sorry, I am having trouble connecting right now. Please try again later.", false);
                    state.aiChatHistory.pop(); // Remove failed prompt from history
                }
            };

            chatSendBtn.addEventListener('click', handleAiQuery);
            chatInput.addEventListener('keypress', (e) => {
                if(e.key === 'Enter') handleAiQuery();
            });
        };

        const renderStorefront = () => {
            const container = $('customer-main-content');
            
            // Filter active products only for storefront
            const activeProducts = state.products.filter(p => p.status === 'Active');

            container.innerHTML = `
                <!-- Hero Banner -->
                <div class="bg-gradient-to-r from-gray-900 to-gray-800 text-white py-16 px-4 lg:px-8 relative overflow-hidden">
                    <div class="absolute inset-0 opacity-20 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')]"></div>
                    <div class="max-w-7xl mx-auto relative z-10 text-center">
                        <h1 class="text-4xl md:text-5xl font-extrabold mb-4 tracking-tight animate-slide-up">Discover Premium Tech</h1>
                        <p class="text-lg text-gray-300 max-w-2xl mx-auto mb-8 animate-slide-up" style="animation-delay: 0.1s">Upgrade your lifestyle with our curated collection of high-tech gadgets and accessories.</p>
                    </div>
                </div>

                <!-- Products Grid -->
                <div class="max-w-7xl mx-auto px-4 lg:px-8 py-12">
                    <div class="flex justify-between items-center mb-8">
                        <h2 class="text-2xl font-bold text-gray-900">Featured Products</h2>
                    </div>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                        ${activeProducts.map(p => `
                            <div class="card group flex flex-col h-full overflow-hidden cursor-pointer" onclick="window.TrendPro.addToCart('${p.id}')">
                                <div class="relative aspect-square overflow-hidden bg-gray-100">
                                    <img src="${p.images?.[0] || 'https://placehold.co/400'}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                                    ${p.pricing?.discount > 0 ? `<span class="absolute top-2 left-2 bg-red-500 text-white text-[10px] font-bold px-2 py-1 rounded shadow-sm">${p.pricing.discount}% OFF</span>` : ''}
                                    <!-- Hover Overlay -->
                                    <div class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-end justify-center pb-4">
                                        <button class="bg-white text-gray-900 font-bold px-6 py-2 rounded-full shadow-lg transform translate-y-4 group-hover:translate-y-0 transition-transform">Add to Cart</button>
                                    </div>
                                </div>
                                <div class="p-4 flex-1 flex flex-col">
                                    <p class="text-xs text-brand-600 font-bold mb-1 uppercase tracking-wider">${p.category || 'Tech'}</p>
                                    <h3 class="font-bold text-gray-900 leading-tight mb-2 line-clamp-2">${p.name}</h3>
                                    <div class="mt-auto flex items-end gap-2">
                                        <span class="text-lg font-bold text-gray-900">${formatCurrency(p.pricing?.sellingPrice)}</span>
                                        ${p.pricing?.mrp > p.pricing?.sellingPrice ? `<span class="text-sm text-gray-400 line-through pb-0.5">${formatCurrency(p.pricing.mrp)}</span>` : ''}
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    ${activeProducts.length === 0 ? `<div class="text-center py-20"><i class="ph ph-package text-5xl text-gray-300 mb-4"></i><p class="text-gray-500">No products available right now.</p></div>` : ''}
                </div>
            `;

            window.TrendPro.addToCart = (id) => {
                const product = state.products.find(p => p.id === id);
                if(!product || product.inventory?.available <= 0) {
                    return showToast('Product is out of stock', 'error');
                }
                
                const existing = state.cart.find(item => item.id === id);
                if(existing) {
                    if(existing.quantity < product.inventory.available) {
                        existing.quantity += 1;
                        showToast('Cart updated');
                    } else {
                        showToast('Max stock reached', 'error');
                    }
                } else {
                    state.cart.push({
                        id: product.id,
                        name: product.name,
                        price: product.pricing.sellingPrice,
                        image: product.images?.[0],
                        sku: product.sku,
                        quantity: 1
                    });
                    showToast('Added to cart');
                }
                updateCartBadge();
                renderCartItems(); // In case cart is open
            };
        };

        // Cart Logic
        const updateCartBadge = () => {
            const badge = $('cart-badge');
            const totalItems = state.cart.reduce((sum, item) => sum + item.quantity, 0);
            if(badge) {
                badge.innerText = totalItems;
                if(totalItems > 0) badge.classList.remove('hidden');
                else badge.classList.add('hidden');
            }
        };

        const renderCartItems = () => {
            const container = $('cart-items');
            if(!container) return;

            let total = 0;
            if(state.cart.length === 0) {
                container.innerHTML = `<div class="flex-1 flex flex-col items-center justify-center text-gray-400"><i class="ph ph-shopping-cart text-5xl mb-4 opacity-50"></i><p>Your cart is empty</p></div>`;
                $('btn-checkout').disabled = true;
                $('cart-total').innerText = '₹0';
                return;
            }

            $('btn-checkout').disabled = false;
            container.innerHTML = state.cart.map((item, index) => {
                total += (item.price * item.quantity);
                return `
                <div class="flex gap-4 p-3 bg-gray-50 rounded-xl border border-gray-100 relative group animate-fade-in">
                    <img src="${item.image || 'https://placehold.co/100'}" class="w-20 h-20 rounded-lg object-cover bg-white">
                    <div class="flex-1 flex flex-col">
                        <h4 class="font-bold text-gray-800 text-sm leading-tight line-clamp-2">${item.name}</h4>
                        <p class="font-bold text-brand-600 mt-1">${formatCurrency(item.price)}</p>
                        <div class="mt-auto flex items-center gap-3">
                            <div class="flex items-center bg-white border border-gray-200 rounded-md">
                                <button onclick="window.TrendPro.updateCartQty(${index}, -1)" class="px-2 py-0.5 text-gray-500 hover:text-gray-900">-</button>
                                <span class="text-xs font-bold w-4 text-center">${item.quantity}</span>
                                <button onclick="window.TrendPro.updateCartQty(${index}, 1)" class="px-2 py-0.5 text-gray-500 hover:text-gray-900">+</button>
                            </div>
                        </div>
                    </div>
                    <button onclick="window.TrendPro.removeCartItem(${index})" class="absolute -top-2 -right-2 bg-white rounded-full p-1 shadow border border-gray-100 text-red-500 opacity-0 group-hover:opacity-100 transition"><i class="ph ph-trash"></i></button>
                </div>
            `}).join('');
            
            $('cart-total').innerText = formatCurrency(total);
        };

        window.TrendPro.updateCartQty = (index, delta) => {
            const item = state.cart[index];
            const product = state.products.find(p => p.id === item.id);
            const newQty = item.quantity + delta;
            
            if(newQty > 0 && newQty <= (product?.inventory?.available || 0)) {
                item.quantity = newQty;
            } else if (newQty === 0) {
                state.cart.splice(index, 1);
            } else {
                showToast('Stock limit reached', 'error');
            }
            updateCartBadge();
            renderCartItems();
        };

        window.TrendPro.removeCartItem = (index) => {
            state.cart.splice(index, 1);
            updateCartBadge();
            renderCartItems();
        };

        const processCheckout = async () => {
            if(state.cart.length === 0) return;
            
            const btn = $('btn-checkout');
            btn.innerHTML = `<i class="ph ph-spinner animate-spin-slow"></i> Processing...`;
            btn.disabled = true;

            try {
                const orderId = generateId('ORD');
                let total = 0;
                const items = state.cart.map(item => {
                    total += (item.price * item.quantity);
                    return { ...item };
                });

                const orderData = {
                    customerId: state.user.uid,
                    customerName: state.user.name,
                    customerEmail: state.user.email,
                    items: items,
                    subtotal: total,
                    total: total, // Add delivery logic here if needed
                    status: 'PENDING',
                    address: { // Mock address for demo, usually from a form
                        street: '123 Tech Avenue',
                        city: 'Bangalore',
                        state: 'Karnataka',
                        zip: '560001'
                    },
                    createdAt: serverTimestamp(),
                    updatedAt: serverTimestamp()
                };

                // Create Order in DB
                await setDoc(PATHS.orderDoc(orderId), orderData);

                // Reduce Stock (Simplified approach without strict transaction for this sandbox constraint)
                for(const item of items) {
                    const product = state.products.find(p => p.id === item.id);
                    if(product && product.inventory?.available >= item.quantity) {
                        await updateDoc(PATHS.productDoc(item.id), {
                            'inventory.available': product.inventory.available - item.quantity
                        });
                    }
                }

                // Clear Cart
                state.cart = [];
                updateCartBadge();
                $('close-cart').click();
                
                // Show Success Modal
                Modal.show(`
                    <div class="p-8 text-center">
                        <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
                            <i class="ph-fill ph-check-circle text-5xl text-green-500"></i>
                        </div>
                        <h2 class="text-2xl font-bold text-gray-900 mb-2">Order Confirmed!</h2>
                        <p class="text-gray-500 mb-6">Your order #${orderId.substring(3,11)} has been placed successfully.</p>
                        <button onclick="window.TrendPro.Modal.hide()" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-3 rounded-xl transition">Continue Shopping</button>
                    </div>
                `);

                showToast('Order placed successfully!');

            } catch(e) {
                console.error(e);
                showToast('Checkout failed. Please try again.', 'error');
                btn.innerHTML = `Proceed to Checkout`;
                btn.disabled = false;
            }
        };

        // --- Start Application ---
        document.addEventListener('DOMContentLoaded', () => {
            initAuth();
        });

    </script>
</body>
</html>
