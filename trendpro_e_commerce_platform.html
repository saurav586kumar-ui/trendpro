        let currentUser = null;

        // --- UTILS & TOASTS ---
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bg = type === 'success' ? 'bg-emerald-600 text-white' : type === 'error' ? 'bg-rose-600 text-white' : 'bg-slate-800 text-white';
            const icon = type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-info';
            toast.className = `${bg} px-4 py-3 rounded-xl shadow-xl flex items-center space-x-3 pointer-events-auto transition-all transform translate-y-2 opacity-0 font-medium text-sm`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-lg"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function formatCurrency(amount) {
            return '₹' + Number(amount || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });
        }

        // --- MODAL SYSTEM ---
        function showModal(contentHTML) {
            const modal = document.getElementById('global-modal');
            const content = document.getElementById('modal-content');
            content.innerHTML = contentHTML;
            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('global-modal').classList.add('hidden');
        }

        // --- ROUTING ENGINE ---
        function navigateTo(route, param = null) {
            activeRoute = route;
            routeParam = param;
            window.location.hash = param ? `#${route}/${param}` : `#${route}`;
            renderRoute();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.addEventListener('hashchange', () => {
            const hash = window.location.hash.substring(1);
            const parts = hash.split('/');
            activeRoute = parts[0] || 'index';
            routeParam = parts[1] || null;
            renderRoute();
        });

        // --- FIREBASE AUTHENTICATION & PROFILE SYNC ---
        auth.onAuthStateChanged(async (user) => {
            currentUser = user;
            if (user) {
                const userRef = db.ref('users/' + user.uid);
                userRef.on('value', (snapshot) => {
                    userProfile = snapshot.val();
                    if (!userProfile) {
                        userProfile = {
                            uid: user.uid,
                            name: user.displayName || 'Valued Customer',
                            email: user.email,
                            phone: user.phoneNumber || '',
                            photoURL: user.photoURL || 'https://placehold.co/150x150/6366f1/ffffff?text=User',
                            walletBalance: 0,
                            addresses: {},
                            createdAt: Date.now()
                        };
                        userRef.set(userProfile);
                    }
                    updateHeaderAuthUI();
                    syncCartAndWishlist();
                });
            } else {
                userProfile = null;
                updateHeaderAuthUI();
            }
            fetchInitialData();
        });

            const authContainer = document.getElementById('auth-section-header');

                const isAdmin = currentUser.email === SPECIAL_ADMIN_EMAIL;
                authContainer.innerHTML = `
                    <div class="flex items-center space-x-3">

                            <img src="${userProfile?.photoURL || currentUser.photoURL || 'https://placehold.co/40x40/6366f1/ffffff?text=U'}" class="w-8 h-8 rounded-full object-cover border border-indigo-500" alt="Profile">
                            <span class="hidden sm:inline text-sm font-semibold truncate max-w-[100px]">${userProfile?.name || 'Account'}</span>
                        </button>
                    </div>
                `;
            } else {
                authContainer.innerHTML = `
                    <button onclick="openAuthModal()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold rounded-xl shadow-md hover:shadow-indigo-500/20 transition-all flex items-center space-x-2">
                        <i class="fa-solid fa-right-to-bracket"></i>
                        <span class="hidden sm:inline">Sign In</span>
                    </button>
                `;
            }
        }

        function openAuthModal() {
            showModal(`
                <div class="p-6 sm:p-8">
                    <div class="text-center mb-6">
                        <div class="w-12 h-12 bg-indigo-100 dark:bg-indigo-900/50 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-3 text-xl font-bold shadow-inner">
                            <i class="fa-solid fa-bolt"></i>
                        </div>
                        <h2 class="text-2xl font-bold tracking-tight">Welcome to TrendPro</h2>
                        <p class="text-slate-500 text-sm mt-1">Sign in with Google to access your wallet, orders, and exclusive perks.</p>
                    </div>
                    <button onclick="signInWithGoogle()" class="w-full py-3.5 px-4 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-800 font-semibold text-sm flex items-center justify-center space-x-3 transition-all shadow-sm">
                        <i class="fa-brands fa-google text-red-500 text-lg"></i>
                        <span>Continue with Google</span>
                    </button>
                    <div class="mt-6 text-center">
                        <button onclick="closeModal()" class="text-xs text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 font-medium">Cancel / Browse as Guest</button>
                    </div>
                </div>
            `);
        }

        async function signInWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                await auth.signInWithPopup(provider);
                closeModal();
                showToast("Signed in successfully!");
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        async function logoutUser() {
            await auth.signOut();
            navigateTo('index');
            showToast("Logged out successfully.");
        }

        // --- DATA SYNCHRONIZATION & SEEDING ---
        function fetchInitialData() {
            db.ref('products').on('value', (snap) => {
                const val = snap.val();
                productsCache = val ? Object.keys(val).map(k => ({ id: k, ...val(val[k] ? val[k] : {}) })) : [];
                // Re-normalize productsCache cleanly
                productsCache = val ? Object.entries(val).map(([id, p]) => ({ id, ...p })) : [];
                if (productsCache.length === 0) seedDemoData();
                renderRoute();
            });

            db.ref('categories').on('value', (snap) => {
                const val = snap.val();
                categoriesCache = val ? Object.entries(val).map(([id, c]) => ({ id, ...c })) : [];
                renderRoute();
            });
        }

        function syncCartAndWishlist() {
            if (!currentUser) return;
            db.ref(`users/${currentUser.uid}/cart`).on('value', (snap) => {
                cartCache = snap.val() || [];
                updateBadges();
            });
            db.ref(`users/${currentUser.uid}/wishlist`).on('value', (snap) => {
                const val = snap.val();
                wishlistCache = val ? Object.keys(val) : [];
                updateBadges();
            });
            db.ref(`users/${currentUser.uid}/compare`).on('value', (snap) => {
                const val = snap.val();
                compareCache = val ? Object.keys(val) : [];
                updateBadges();
            });
            // Notifications & Unread badge
            db.ref(`notifications/${currentUser.uid}`).on('value', (snap) => {
                const val = snap.val();
                renderNotificationsDrawer(val);
            });
        }

        function updateBadges() {
            const cartCount = cartCache.reduce((sum, item) => sum + (item.quantity || 1), 0);
            const wishCount = wishlistCache.length;
            const compCount = compareCache.length;

            ['cart-badge', 'mobile-cart-badge'].forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.textContent = cartCount;
                    el.classList.toggle('hidden', cartCount === 0);
                }
            });

            const wishEl = document.getElementById('wishlist-badge');
            if (wishEl) {
                wishEl.textContent = wishCount;
                wishEl.classList.toggle('hidden', wishCount === 0);
            }

            const compEl = document.getElementById('compare-badge');
            if (compEl) {
                compEl.textContent = compCount;
                compEl.classList.toggle('hidden', compCount === 0);
            }
        }

        // --- CART SYSTEM ---
        async function addToCart(productId) {
            if (!currentUser) {
                openAuthModal();
                return;
            }
            const p = productsCache.find(x => x.id === productId);
            if (!p) return;

            const existingIndex = cartCache.findIndex(item => item.productId === productId);
            if (existingIndex > -1) {
                cartCache[existingIndex].quantity = (cartCache[existingIndex].quantity || 1) + 1;
            } else {
                cartCache.push({
                    productId: p.id,
                    title: p.title,
                    price: p.discountedPrice || p.price,
                    thumbnail: p.thumbnail,
                    quantity: 1
                });
            }

            await db.ref(`users/${currentUser.uid}/cart`).set(cartCache);
            showToast("Added product to cart!");
        }

            if (Object.keys(addresses).length === 0) {

        async function placeOrder(totalAmount) {
            const addrRadio = document.querySelector('input[name="selected_address"]:checked');
            const payRadio = document.querySelector('input[name="payment_method"]:checked');
            if (!addrRadio || !payRadio) {
                showToast("Please select delivery address and payment method.", "error");
                return;
            }

            const addrKey = addrRadio.value;
            const address = userProfile.addresses[addrKey];
            const paymentMethod = payRadio.value;

            if (paymentMethod === 'WALLET' && (userProfile.walletBalance || 0) < Number(totalAmount)) {
                showToast("Insufficient wallet balance!", "error");
                return;
            }

            const orderId = 'TP-' + new Date().toISOString().slice(0,10).replace(/-/g,'') + '-' + Math.random().toString(36).substring(2,7).toUpperCase();
            
            const orderData = {
                orderId,
                uid: currentUser.uid,
                customerName: userProfile.name,
                email: userProfile.email,
                phone: address.phone,
                products: cartCache,
                deliveryAddress: address,
                paymentMethod,
                paymentStatus: paymentMethod === 'WALLET' || paymentMethod === 'UPI_DEMO' ? 'Paid' : 'Pending',
                totalAmount: Number(totalAmount),
                status: 'New Order',
                timestamp: Date.now()
            };

            await db.ref(`orders/${orderId}`).set(orderData);

            // Deduct wallet if used
            if (paymentMethod === 'WALLET') {
                const newBalance = userProfile.walletBalance - Number(totalAmount);
                await db.ref(`users/${currentUser.uid}/walletBalance`).set(newBalance);
            }

            // Clear Cart
            await db.ref(`users/${currentUser.uid}/cart`).set(null);

            // Add notification
            const notifId = db.ref(`notifications/${currentUser.uid}`).push().key;
            await db.ref(`notifications/${currentUser.uid}/${notifId}`).set({
                id: notifId,
                title: "Order Placed Successfully",
                message: `Your order ${orderId} has been successfully placed.`,
                timestamp: Date.now(),
                read: false
            });

            navigateTo('order-success', orderId);
            showToast("Order placed successfully!");
        }

            const code = document.getElementById('gift-code-input').value.trim();

            const val = snap.val();
            if (!val) {
                showToast("Invalid gift voucher code", "error");

            const giftId = Object.keys(val)[0];
            const gift = val[giftId];
            if (gift.redeemed) {

            const amount = gift.amount;
            const newBalance = (userProfile.walletBalance || 0) + amount;
            await db.ref(`users/${currentUser.uid}/walletBalance`).set(newBalance);
            await db.ref(`giftCards/${giftId}/redeemed`).set(true);

            closeModal();

                <div class="max-w-3xl mx-auto px-4 py-10">
                    <div class="bg-white dark:bg-slate-900 p-8 sm:p-12 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 space-y-8" id="invoice-printable">
                        <div class="flex justify-between items-start">
                            <div>
                                <h1 class="text-3xl font-black bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">TRENDPRO</h1>
                                <p class="text-xs text-slate-400 mt-1">Official Tax Invoice</p>
                            </div>
                            <div class="text-right">
                                <h3 class="font-bold text-sm" id="inv-id">${orderId}</h3>
                                <p class="text-xs text-slate-400 mt-1" id="inv-date">Date: Oct 7, 2026</p>
                            </div>
                        </div>
                        <div id="invoice-content-body">Loading invoice data...</div>
                        <button onclick="window.print()" class="w-full py-3.5 bg-indigo-600 text-white font-bold rounded-xl shadow-md">Print / Download Invoice</button>
                    </div>
                </div>
            `;
        }

        db.ref('orders').on('value', snap => {
            const val = snap.val();
            if (activeRoute === 'invoice' && routeParam && val && val[routeParam]) {
                const o = val[routeParam];
                const body = document.getElementById('invoice-content-body');
                if (body) {
                    body.innerHTML = `
                        <div class="space-y-6">
                            <div>
                                <h4 class="font-bold text-sm text-slate-400 uppercase tracking-wider mb-1">Billed To</h4>
                                <h3 class="font-bold text-base">${o.customerName}</h3>
                                <p class="text-xs text-slate-500">${o.deliveryAddress.house}, ${o.deliveryAddress.area}, ${o.deliveryAddress.city} - ${o.deliveryAddress.pincode}</p>
                                <p class="text-xs text-slate-500">Phone: ${o.phone}</p>
                            </div>
                            <table class="w-full text-sm">
                                <thead>
                                    <tr class="border-b border-slate-200 dark:border-slate-700 text-left">
                                        <th class="pb-3">Item</th>
                                        <th class="pb-3 text-center">Qty</th>
                                        <th class="pb-3 text-right">Price</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${o.products.map(p => `
                                        <tr class="border-b border-slate-100 dark:border-slate-800">
                                            <td class="py-3 font-medium">${p.title}</td>
                                            <td class="py-3 text-center">${p.quantity}</td>
                                            <td class="py-3 text-right">${formatCurrency(p.price * p.quantity)}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                            <div class="flex justify-end pt-4">
                                <div class="w-64 space-y-2 text-sm">
                                    <div class="flex justify-between font-black text-lg pt-2 border-t border-slate-200 dark:border-slate-700">
                                        <span>Total Paid</span>
                                        <span>${formatCurrency(o.totalAmount)}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }
            }
        });

        // --- SEARCH ENGINE ---
        function executeSearch(query) {
            if (!query.trim()) return;
            navigateTo('search', encodeURIComponent(query));
        }

        function renderSearchPage(queryParam) {
            const query = decodeURIComponent(queryParam || '').toLowerCase();
            const results = productsCache.filter(p => 
                p.title.toLowerCase().includes(query) || 
                p.category?.toLowerCase().includes(query) || 
                p.brand?.toLowerCase().includes(query) ||
                p.sku?.toLowerCase().includes(query)
            );

            return `
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
                    <h1 class="text-2xl font-black tracking-tight mb-2">Search Results for "${query}"</h1>
                    <p class="text-slate-500 text-sm mb-8">Found ${results.length} matching products</p>
                    ${results.length === 0 ? `<p class="text-slate-400">No products found matching your search query.</p>` : `
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                            ${results.map(p => renderProductCard(p)).join('')}
                        </div>
                    `}
                </div>
            `;
        }

        function renderCategoryPage(categoryName) {
            const results = productsCache.filter(p => p.category === categoryName || (p.categories && p.categories[categoryName]));
            return `
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
                    <h1 class="text-3xl font-black tracking-tight mb-2">${categoryName}</h1>
                    <p class="text-slate-500 text-sm mb-8">Showing ${results.length} items in ${categoryName}</p>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                        ${results.map(p => renderProductCard(p)).join('')}
                    </div>
                </div>
            `;
        }

        // --- ADMIN PANEL DASHBOARD & MANAGEMENT ---
        function renderAdminPage() {
            return `
                <div class="flex h-full min-h-screen bg-slate-100 dark:bg-slate-950">
                    <!-- Admin Sidebar -->
                    <aside class="w-64 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 p-6 hidden lg:flex flex-col justify-between">
                        <div class="space-y-6">
                            <div class="flex items-center space-x-2">
                                <div class="w-8 h-8 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold"><i class="fa-solid fa-shield-halved"></i></div>
                                <span class="font-extrabold text-lg">Admin Portal</span>
                            </div>
                            <nav class="space-y-1">
                                <button onclick="switchAdminTab('dashboard')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-bold ${activeAdminTab === 'dashboard' ? 'bg-indigo-50 dark:bg-indigo-900/40 text-indigo-600' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800'}"><i class="fa-solid fa-chart-pie w-5"></i><span>Dashboard</span></button>
                                <button onclick="switchAdminTab('products')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-bold ${activeAdminTab === 'products' ? 'bg-indigo-50 dark:bg-indigo-900/40 text-indigo-600' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800'}"><i class="fa-solid fa-box w-5"></i><span>Products</span></button>
                                <button onclick="switchAdminTab('orders')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-bold ${activeAdminTab === 'orders' ? 'bg-indigo-50 dark:bg-indigo-900/40 text-indigo-600' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800'}"><i class="fa-solid fa-bag-shopping w-5"></i><span>Orders</span></button>
                                <button onclick="switchAdminTab('categories')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-bold ${activeAdminTab === 'categories' ? 'bg-indigo-50 dark:bg-indigo-900/40 text-indigo-600' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800'}"><i class="fa-solid fa-tags w-5"></i><span>Categories</span></button>
                            </nav>
                        </div>
                        <button onclick="navigateTo('index')" class="px-4 py-3 bg-slate-100 dark:bg-slate-800 text-xs font-bold rounded-xl text-center">Exit to Storefront</button>
                    </aside>

                    <!-- Admin Main Content -->
                    <div class="flex-1 overflow-y-auto p-6 sm:p-10">
                        <div id="admin-tab-content">
                            <!-- Dynamic Admin Tab -->
                        </div>
                    </div>
                </div>
            `;
        }

        function switchAdminTab(tab) {
            activeAdminTab = tab;
            renderRoute();
        }

        // Render admin tab contents dynamically after renderAdminPage
        const _origRenderRoute = renderRoute;
        renderRoute = function() {
            _origRenderRoute();
            if (activeRoute === 'admin') {
                const container = document.getElementById('admin-tab-content');
                if (!container) return;

                if (activeAdminTab === 'dashboard') {
                    container.innerHTML = `
                        <h1 class="text-2xl font-black tracking-tight mb-6">Dashboard Analytics</h1>
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 mb-8">
                            <div class="bg-white dark:bg-slate-900 p-6 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-800">
                                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Total Products</span>
                                <h3 class="text-3xl font-black mt-2">${productsCache.length}</h3>
                            </div>
                            <div class="bg-white dark:bg-slate-900 p-6 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-800">
                                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Total Categories</span>
                                <h3 class="text-3xl font-black mt-2">${categoriesCache.length}</h3>
                            </div>
                            <div class="bg-white dark:bg-slate-900 p-6 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-800">
                                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Active Store Status</span>
                                <h3 class="text-3xl font-black text-emerald-500 mt-2">ONLINE</h3>
                            </div>
                        </div>
                    `;
                } else if (activeAdminTab === 'products') {
                    container.innerHTML = `
                        <div class="flex items-center justify-between mb-6">
                            <h1 class="text-2xl font-black tracking-tight">Product Management</h1>
                            <button onclick="openAddProductModal()" class="px-4 py-2.5 bg-indigo-600 text-white font-bold text-xs rounded-xl shadow-md">+ Add Product</button>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                            ${productsCache.map(p => `
                                <div class="bg-white dark:bg-slate-900 p-4 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 flex items-center justify-between">
                                    <div class="flex items-center space-x-3">
                                        <img src="${p.thumbnail}" class="w-14 h-14 rounded-xl object-cover" alt="">
                                        <div><h4 class="font-bold text-sm">${p.title}</h4><span class="text-xs text-indigo-600 font-bold">${formatCurrency(p.discountedPrice || p.price)}</span></div>
                                    </div>
                                    <button onclick="deleteProduct('${p.id}')" class="text-rose-500 hover:text-rose-700 p-2"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            `).join('')}
                        </div>
                    `;
                } else if (activeAdminTab === 'orders') {
                    container.innerHTML = `
                        <h1 class="text-2xl font-black tracking-tight mb-6">Order Management</h1>
                        <div id="admin-orders-table" class="space-y-4">Loading orders...</div>
                    `;
                    db.ref('orders').once('value', snap => {
                        const val = snap.val();
                        const el = document.getElementById('admin-orders-table');
                        if (el && val) {
                            el.innerHTML = Object.entries(val).map(([id, o]) => `
                                <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 flex items-center justify-between">
                                    <div>
                                        <span class="text-xs font-bold text-indigo-600">${o.orderId}</span>
                                        <h4 class="font-bold text-sm mt-0.5">${o.customerName} (${o.phone})</h4>
                                        <span class="text-xs text-slate-400">Total: ${formatCurrency(o.totalAmount)}</span>
                                    </div>
                                    <div class="flex items-center space-x-3">
                                        <select onchange="updateOrderStatus('${id}', this.value)" class="bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-1.5 text-xs font-bold">
                                            ${['New Order', 'Confirmed', 'Packed', 'Dispatched', 'Out for Delivery', 'Delivered', 'Cancelled'].map(s => `<option ${o.status === s ? 'selected' : ''}>${s}</option>`).join('')}
                                        </select>
                                    </div>
                                </div>
                            `).join('');
                        }
                    });
                } else if (activeAdminTab === 'categories') {
                    container.innerHTML = `
                        <div class="flex items-center justify-between mb-6">
                            <h1 class="text-2xl font-black tracking-tight">Category Management</h1>
                            <button onclick="openAddCategoryModal()" class="px-4 py-2.5 bg-indigo-600 text-white font-bold text-xs rounded-xl shadow-md">+ Add Category</button>
                        </div>
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                            ${categoriesCache.map(c => `
                                <div class="bg-white dark:bg-slate-900 p-4 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 text-center">
                                    <img src="${c.image}" class="w-20 h-20 mx-auto rounded-xl object-cover mb-2" alt="">
                                    <h4 class="font-bold text-sm">${c.name}</h4>
                                </div>
                            `).join('')}
                        </div>
                    `;
                }
            }
        };

        function openAddProductModal() {
            showModal(`
                <div class="p-6 sm:p-8 space-y-4 max-h-[90vh] overflow-y-auto">
                    <h3 class="font-bold text-xl">Add New Product</h3>
                    <input type="text" id="prod-title" placeholder="Product Title" class="w-full bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm">
                    <textarea id="prod-desc" placeholder="Product Description" class="w-full bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm"></textarea>
                    <div class="grid grid-cols-2 gap-4">
                        <input type="number" id="prod-price" placeholder="Price (₹)" class="bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm">
                        <input type="number" id="prod-discount" placeholder="Discounted Price (₹)" class="bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm">
                    </div>
                    <input type="text" id="prod-category" placeholder="Category Name" class="w-full bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm">
                    <input type="text" id="prod-thumb" placeholder="Thumbnail Image URL" class="w-full bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm">
                    <button onclick="saveNewProduct()" class="w-full py-3.5 bg-indigo-600 text-white font-bold rounded-xl shadow-lg">Save Product</button>
                </div>
            `);
        }

        async function saveNewProduct() {
            const title = document.getElementById('prod-title').value;
            const description = document.getElementById('prod-desc').value;
            const price = Number(document.getElementById('prod-price').value);
            const discountedPrice = Number(document.getElementById('prod-discount').value);
            const category = document.getElementById('prod-category').value;
            const thumbnail = document.getElementById('prod-thumb').value;

            if (!title || !price || !category) {
                showToast("Please fill required fields", "error");
                return;
            }

            const productId = db.ref('products').push().key;
            const prodData = {
                id: productId,
                title,
                description,
                shortDescription: description.substring(0, 80),
                price,
                discountedPrice,
                category,
                thumbnail: thumbnail || 'https://placehold.co/600x600/6366f1/ffffff?text=Product',
                images: [thumbnail],
                featured: true,
                active: true,
                createdAt: Date.now()
            };

            await db.ref(`products/${productId}`).set(prodData);
            closeModal();
            showToast("Product created successfully!");
        }

        async function deleteProduct(id) {
            await db.ref(`products/${id}`).remove();
            showToast("Product deleted successfully");
        }

        async function updateOrderStatus(orderId, newStatus) {
            await db.ref(`orders/${orderId}/status`).set(newStatus);
            showToast(`Order status updated to ${newStatus}`);
        }

        function openAddCategoryModal() {
            showModal(`
                <div class="p-6 sm:p-8 space-y-4">
                    <h3 class="font-bold text-xl">Add Category</h3>
                    <input type="text" id="cat-name" placeholder="Category Name" class="w-full bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm">
                    <input type="text" id="cat-img" placeholder="Category Image URL" class="w-full bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm">
                    <button onclick="saveNewCategory()" class="w-full py-3.5 bg-indigo-600 text-white font-bold rounded-xl shadow-lg">Save Category</button>
                </div>
            `);
        }

        async function saveNewCategory() {
            const name = document.getElementById('cat-name').value;
            const image = document.getElementById('cat-img').value;
            if (!name) return;

            const catId = db.ref('categories').push().key;
            await db.ref(`categories/${catId}`).set({ name, image });
            closeModal();
            showToast("Category created successfully!");
        }

        function dismissAnnouncement() {
            const bar = document.getElementById('announcement-bar');
            if (bar) bar.style.display = 'none';
        }

        function checkAuthAndNavigateProfile() {
            if (!currentUser) openAuthModal();
            else navigateTo('profile');
        }

        function initHomeSliders() {}
        function initAdminDashboardCharts() {}

        // Initial render on load
        window.onload = function() {
            const hash = window.location.hash.substring(1);
            if (hash) {
                const parts = hash.split('/');
                activeRoute = parts[0] || 'index';
                routeParam = parts[1] || null;
            }
            renderRoute();
        };
    </script>
</body>
</html>
